
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atri Academy - University ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --secondary: #3b82f6; }
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .hero { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 60px 0; text-align: center; }
        .feature-card { background: white; border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; border: none; text-decoration: none; display: block; color: inherit; }
        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon-box { width: 60px; height: 60px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: var(--primary); font-size: 24px; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1 class="fw-bold">Atri Academy ERP</h1>
            <p class="lead">Select a portal to continue</p>
        </div>
    </div>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-4">
                <a href="login.html?type=student" class="feature-card">
                    <div class="icon-box"><i class="fas fa-user-graduate"></i></div>
                    <h4>Student Login</h4>
                    <p class="text-muted">Access your dashboard & results</p>
                </a>
            </div>
            <div class="col-md-4">
                <a href="login.html?type=teacher" class="feature-card">
                    <div class="icon-box"><i class="fas fa-chalkboard-teacher"></i></div>
                    <h4>Teacher Login</h4>
                    <p class="text-muted">Manage classes and attendance</p>
                </a>
            </div>
            <div class="col-md-4">
                <a href="login.html?type=admission" class="feature-card">
                    <div class="icon-box"><i class="fas fa-university"></i></div>
                    <h4>Online Admission</h4>
                    <p class="text-muted">Apply for new sessions</p>
                </a>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted">
        <p>&copy; 2026 Atri Academy</p>
    </footer>
</body>
</html>
