<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atri Academy - Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn-primary { background: #1e3a8a; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 600; }
        .logo { font-size: 2rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1.5rem; }
        .form-control { border-radius: 10px; padding: 12px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fas fa-graduation-cap me-2"></i>Atri Academy</div>
        <h4 id="login-title" class="mb-4 text-muted">Portal Login</h4>
        <form>
            <input type="text" class="form-control" placeholder="Registration ID / Username" required>
            <input type="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-primary mt-2">Login Now</button>
        </form>
        <div class="mt-4">
            <a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
        </div>
    </div>

    <script>
        // Ye script URL se portal ka naam check karegi
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        if(type) {
            document.getElementById('login-title').innerText = type.charAt(0).toUpperCase() + type.slice(1) + " Login Portal";
        }
    </script>
</body>
</html>
